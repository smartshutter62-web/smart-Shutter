function calcWin(w){

 const lim=b=>{const v=S.boxes[b]?.[tube];return v==null||v===''?null:+v};
 let box=null;
 if(w.bm){box=+w.bm;const l=lim(box);if(l==null)warn.push('هذا الصندوق غير معتمد في الجدول لهذه الماسورة.');else if(H>l)warn.push('ارتفاع الشباك أكبر من أقصى ارتفاع للصندوق في الجدول.')}
 else{for(const b of Object.keys(S.boxes).map(Number).sort((a,b)=>a-b)){const l=lim(b);if(l!=null&&H<=l){box=b;break}}
  if(!box)return{err:'لا يوجد صندوق مناسب لارتفاع '+H+' سم مع ماسورة '+tube+' سم. راجع جدول الصناديق أو اختر الصندوق يدوياً.'}}
 const sl=S.slats.find(s=>s.id==w.slat);if(!sl)return{err:'اختر نوع الريشة.'};
 const mw=W-S.ded,mh=S.hmode=='opening'?H:S.hmode=='slat'?Math.floor(H/sl.h)*sl.h:H-box/10;
 if(!(mw>0)||!(mh>0))return{err:'عرض التصنيع ('+r2(mw)+') أو ارتفاعه ('+r2(mh)+') صفر أو أقل، ولا يمكن حفظ الشباك.'};
 const mx=num(sl.max);if(mx>0&&mw>mx)return{err:'طول الشريحة ('+r2(mw)+' سم) أكبر من الحد الأقصى للريشة ('+mx+' سم). أقصى عرض للفتحة '+r2(mx+S.ded)+' سم، أو قسّم الشباك.'};
 const q=Math.max(1,parseInt(w.q)||1),mot=w.m=='motor'?(parseInt(w.mc)||0):0;
 if(w.m=='motor'&&mot<1)return{err:'عدد المواتير يجب ألا يقل عن 1.'};
 const au=W*H/1e4,area=au*q,am=mw*mh/1e4*q,col=S.colors.find(c=>c.n==w.col),pr=col?.p?.[sl.id]||[0,0];
 if(!col)warn.push('اللون غير موجود في الإعدادات.');else if(!(num(pr[1])>0))warn.push('لم يتم إدخال سعر بيع لهذا اللون ونوع الريشة (السعر = صفر).');
 const slatSale=r2(area*(num(pr[1])||0)),cost=r2(am*(num(pr[0])||0));let mSale=0;
 if(mot){const t=[...S.tiers].sort((a,b)=>(a.max===''?1e9:num(a.max))-(b.max===''?1e9:num(b.max)));

 const mCost=r2(mot*(num(S.motorCost)||0));
 return{box,mw,mh,au,area,am,slatSale,mot,mSale,cost:cost+mCost,sale:slatSale+mSale,warn,q}}
function totals(Q){const sub=r2(Q.wins.reduce((a,w)=>a+w.c.sale,0)),disc=r2(sub*(num(Q.disc)||0)/100),after=sub-disc,tr=num(Q.tr)||0,
 tax=Q.addTax?r2((after+tr)*S.tax/100):0,grand=r2(after+tr+tax),cost=r2(Q.wins.reduce((a,w)=>a+w.c.cost,0)),p=S.pays,
 p1=r2(grand*p[0]/100),p2=r2(grand*p[1]/100);
